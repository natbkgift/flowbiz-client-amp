version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-flowbiz}
      - POSTGRES_USER=${POSTGRES_USER:-flowbiz}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-flowbiz}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowbiz -d flowbiz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      - APP_ENV=dev
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - APP_LOG_LEVEL=info
      - FLOWBIZ_SERVICE_NAME=flowbiz-template-service
      - FLOWBIZ_VERSION=${FLOWBIZ_VERSION:-0.1.0}
      - FLOWBIZ_BUILD_SHA=${BUILD_SHA:-local}
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg2://flowbiz:flowbiz@postgres:5432/flowbiz}
      - JWT_SECRET_KEY=change-me-in-production
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRE_MINUTES=120
      - ADMIN_BOOTSTRAP_EMAIL=admin@local.dev
      - ADMIN_BOOTSTRAP_PASSWORD=admin123
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  admin-app:
    build:
      context: ./admin-app
      dockerfile: Dockerfile
    expose:
      - "3000"
    environment:
      - NEXT_PUBLIC_API_BASE=/api
    restart: unless-stopped

  scraper-renthai:
    build:
      context: ./scraper-renthai
      dockerfile: Dockerfile
    environment:
      - API_BASE=http://api:8000
      - ADMIN_TOKEN=${ADMIN_TOKEN}
    volumes:
      - ./scraper-renthai/storage:/app/storage
    depends_on:
      - api
    profiles:
      - scraper
    restart: "no"

volumes:
  postgres_data:
