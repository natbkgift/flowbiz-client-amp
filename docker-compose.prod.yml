services:
  api:
    env_file:
      - ${FLOWBIZ_ENV_FILE:-.env}
    environment:
      APP_ENV: prod
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318/v1/traces}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-flowbiz-client-amp-api}
    ports:
      - "127.0.0.1:${VPS_API_PORT:-8001}:8000"
    volumes:
      - /opt/flowbiz/storage/media:/app/storage/media
      - /opt/flowbiz/storage/property-images:/opt/flowbiz/storage/property-images:ro
      - /opt/flowbiz/clients/flowbiz-client-amp/ops/logs:/app/ops/logs:ro
    restart: always

  admin-app:
    environment:
      FLOWBIZ_DEPLOY_TELEMETRY_PATH: ${FLOWBIZ_DEPLOY_TELEMETRY_PATH:-/app/ops/logs/deploy_telemetry.json}
    ports:
      - "127.0.0.1:${VPS_ADMIN_PORT:-8002}:3000"
    volumes:
      - /opt/flowbiz/clients/flowbiz-client-amp/ops/logs:/app/ops/logs:ro
    restart: always
