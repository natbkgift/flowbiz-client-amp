name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository }}/api
  ADMIN_IMAGE: ghcr.io/${{ github.repository }}/admin-app
  SITE_URL: https://amppattaya.com

jobs:
  # ── Stage 1: Lint & Test ───────────────────────────────────
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Pytest
        run: pytest -q --tb=short

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install admin-app dependencies
        working-directory: admin-app
        run: npm ci

      - name: Next.js lint
        working-directory: admin-app
        run: npm run lint

      - name: TypeScript check
        working-directory: admin-app
        run: npx tsc --noEmit

  # ── Stage 2: Build & Push Docker Images ────────────────────
  build:
    needs: lint-test
    runs-on: ubuntu-latest
    outputs:
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "sha_tag=sha-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ steps.meta.outputs.sha_tag }}
            ${{ env.API_IMAGE }}:latest
          build-args: |
            GIT_SHA=${{ github.sha }}

      - name: Build & push Admin-App image
        uses: docker/build-push-action@v5
        with:
          context: ./admin-app
          push: true
          tags: |
            ${{ env.ADMIN_IMAGE }}:${{ steps.meta.outputs.sha_tag }}
            ${{ env.ADMIN_IMAGE }}:latest

  # ── Stage 3: Deploy to VPS ─────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve SSH target
        id: sshmeta
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_URL: ${{ secrets.VPS_URL }}
        run: |
          set -euo pipefail

          if [[ -z "${VPS_SSH_KEY:-}" ]]; then
            echo "::error::Missing required secret: VPS_SSH_KEY"
            exit 1
          fi
          if [[ -z "${VPS_PORT:-}" ]]; then
            echo "::error::Missing required secret: VPS_PORT"
            exit 1
          fi

          ssh_host=""
          ssh_user=""

          if [[ -n "${VPS_HOST:-}" && -n "${VPS_USER:-}" ]]; then
            ssh_host="$VPS_HOST"
            ssh_user="$VPS_USER"
          elif [[ -n "${VPS_URL:-}" ]]; then
            raw="$VPS_URL"
            raw="${raw#ssh://}"
            raw="${raw%%/*}"

            if [[ "$raw" == *"@"* ]]; then
              ssh_user="${raw%%@*}"
              ssh_host="${raw#*@}"
              ssh_host="${ssh_host%%:*}"
            else
              echo "::error::VPS_URL must include username, e.g. 'deploy@1.2.3.4' or set VPS_HOST + VPS_USER"
              exit 1
            fi
          else
            echo "::error::Missing SSH target secrets. Provide VPS_HOST+VPS_USER or VPS_URL (user@host)."
            exit 1
          fi

          if [[ -z "$ssh_host" || -z "$ssh_user" ]]; then
            echo "::error::Could not resolve SSH host/user"
            exit 1
          fi

          echo "host=$ssh_host" >> "$GITHUB_OUTPUT"
          echo "user=$ssh_user" >> "$GITHUB_OUTPUT"

      - name: Check SSH reachability
        env:
          SSH_HOST: ${{ steps.sshmeta.outputs.host }}
          SSH_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          echo "Checking TCP reachability: ${SSH_HOST}:${SSH_PORT}"
          timeout 10 bash -c "</dev/tcp/${SSH_HOST}/${SSH_PORT}" >/dev/null 2>&1 || {
            echo "::error::Cannot reach ${SSH_HOST}:${SSH_PORT} from GitHub Actions runner. Check VPS_PORT (SSH port) and firewall/security groups."
            exit 1
          }

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.sshmeta.outputs.host }}
          username: ${{ steps.sshmeta.outputs.user }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/flowbiz/clients/flowbiz-client-amp

            compose() {
              docker compose -f docker-compose.yml -f docker-compose.prod.yml "$@"
            }

            # Authenticate to GHCR on the VPS so docker pull can access private images
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            # ╔══════════════════════════════════════════════════════════════╗
            # ║  PERMANENT: VPS repo sync — DO NOT REMOVE                    ║
            # ║  Without this, the VPS working directory stays at an old     ║
            # ║  commit.  docker-compose.prod.yml and alembic migrations      ║
            # ║  read from the working dir, so a stale checkout causes the   ║
            # ║  wrong image tag / old migration files to be used.           ║
            # ╚══════════════════════════════════════════════════════════════╝
            echo "Syncing repository to deployed commit"
            echo "target_sha=${{ github.sha }}"
            if command -v git >/dev/null 2>&1; then
              git rev-parse --short HEAD || true
              git fetch origin main --prune
              git checkout -f main
              git reset --hard "${{ github.sha }}"
              git clean -fd
              echo "repo_head=$(git rev-parse --short HEAD)"
            else
              echo "WARNING: git not found on VPS; cannot sync repo. Deploy may use stale compose/migrations."
            fi

            # Save current running image IDs for rollback (persistent path)
            # Using image IDs (sha256:...) ensures rollback works even if tags move.
            DEPLOY_STATE_DIR="/opt/flowbiz/clients/flowbiz-client-amp/.deploy"
            mkdir -p "$DEPLOY_STATE_DIR"

            API_CID="$(compose ps -q api 2>/dev/null | head -n 1 || true)"
            ADMIN_CID="$(compose ps -q admin-app 2>/dev/null | head -n 1 || true)"
            API_IMAGE_ID="$(docker inspect --format '{{.Image}}' "$API_CID" 2>/dev/null || true)"
            ADMIN_IMAGE_ID="$(docker inspect --format '{{.Image}}' "$ADMIN_CID" 2>/dev/null || true)"

            {
              echo "API_IMAGE_ID=${API_IMAGE_ID}"
              echo "ADMIN_IMAGE_ID=${ADMIN_IMAGE_ID}"
            } > "$DEPLOY_STATE_DIR/previous_image_ids.env"

            # Pull latest images
            docker pull "${{ env.API_IMAGE }}:${{ needs.build.outputs.sha_tag }}"
            docker pull "${{ env.ADMIN_IMAGE }}:${{ needs.build.outputs.sha_tag }}"

            # Tag as :latest (registry) and to the local image names used by docker-compose.yml
            docker tag "${{ env.API_IMAGE }}:${{ needs.build.outputs.sha_tag }}" "${{ env.API_IMAGE }}:latest"
            docker tag "${{ env.ADMIN_IMAGE }}:${{ needs.build.outputs.sha_tag }}" "${{ env.ADMIN_IMAGE }}:latest"
            docker tag "${{ env.API_IMAGE }}:${{ needs.build.outputs.sha_tag }}" "flowbiz-client-amp-api:latest"
            docker tag "${{ env.ADMIN_IMAGE }}:${{ needs.build.outputs.sha_tag }}" "flowbiz-client-amp-admin-app:latest"

            # Rolling restart
            compose up -d --remove-orphans --force-recreate

            echo "Running container images (post-up)"
            API_CID_AFTER="$(compose ps -q api 2>/dev/null | head -n 1 || true)"
            ADMIN_CID_AFTER="$(compose ps -q admin-app 2>/dev/null | head -n 1 || true)"
            echo "api_container_id=${API_CID_AFTER}"
            echo "admin_container_id=${ADMIN_CID_AFTER}"
            if [[ -n "${API_CID_AFTER}" ]]; then
              docker inspect --format 'api_image_ref={{.Config.Image}} api_image_id={{.Image}}' "${API_CID_AFTER}" || true
            fi
            if [[ -n "${ADMIN_CID_AFTER}" ]]; then
              docker inspect --format 'admin_image_ref={{.Config.Image}} admin_image_id={{.Image}}' "${ADMIN_CID_AFTER}" || true
            fi

            # ╔══════════════════════════════════════════════════════════════╗
            # ║  PERMANENT: online migration only — DO NOT add --sql flag    ║
            # ║  `alembic upgrade head --sql` runs in offline/dry-run mode.  ║
            # ║  Any migration that queries the DB (e.g. duplicate checks)   ║
            # ║  will crash with `AttributeError: 'NoneType' ...` because    ║
            # ║  Alembic's MockConnection returns None from execute().        ║
            # ║  The real online `alembic upgrade head` is safe and correct. ║
            # ╚══════════════════════════════════════════════════════════════╝
            echo "Applying migrations"
            compose exec -T api alembic upgrade head

            echo "DB fingerprint (from api container settings.database_url; redacted+sha256[:12])"
            compose exec -T api python - <<'PY'
            import hashlib
            from packages.core.config import settings

            raw = (settings.database_url or "").strip()
            if not raw:
                print("db_fingerprint=missing")
                raise SystemExit(0)

            redacted = raw
            if "://" in raw and "@" in raw:
                prefix, rest = raw.split("://", 1)
                creds, tail = rest.split("@", 1)
                if ":" in creds:
                    user = creds.split(":", 1)[0]
                    redacted = f"{prefix}://{user}@{tail}"

            digest = hashlib.sha256(redacted.encode("utf-8", errors="ignore")).hexdigest()
            print("db_fingerprint=" + digest[:12])
            PY

            echo "Seeding public catalog (developers/areas/projects/units)"
            # Idempotent upsert by slug (projects) and source_id (properties).
            compose exec -T api \
              env AMP_ALLOW_IMPORT=1 python scripts/import_seed_data.py --input data/import \
              --step developers --step areas --step projects --step units_buy --step units_rent

            echo "Verifying seed populated projects"
            projects_total=$(compose exec -T api \
              python -c "from sqlalchemy import func, select; from packages.core.database import SessionLocal; from packages.core.models import Project; db=SessionLocal(); print(int(db.scalar(select(func.count()).select_from(Project)) or 0)); db.close()" \
              | tr -d '\r' | tail -n 1)
            projects_published=$(compose exec -T api \
              python -c "from sqlalchemy import func, select; from packages.core.database import SessionLocal; from packages.core.models import Project; db=SessionLocal(); print(int(db.scalar(select(func.count()).select_from(Project).where(Project.status=='published')) or 0)); db.close()" \
              | tr -d '\r' | tail -n 1)
            echo "projects_total=${projects_total}"
            echo "projects_published=${projects_published}"
            if [[ "${projects_total}" == "0" ]]; then
              echo "ERROR: projects_total=0 after seeding. Check DATABASE_URL / migrations / seed input." 
              echo "TIP: check /api/v1/db-stats for a safe fingerprint + counts"
              exit 1
            fi

            echo "DB fingerprint (post-seed; should match pre-seed)"
            compose exec -T api python - <<'PY'
            import hashlib
            from packages.core.config import settings

            raw = (settings.database_url or "").strip()
            if not raw:
              print("db_fingerprint=missing")
              raise SystemExit(0)

            redacted = raw
            if "://" in raw and "@" in raw:
              prefix, rest = raw.split("://", 1)
              creds, tail = rest.split("@", 1)
              if ":" in creds:
                user = creds.split(":", 1)[0]
                redacted = f"{prefix}://{user}@{tail}"

            digest = hashlib.sha256(redacted.encode("utf-8", errors="ignore")).hexdigest()
            print("db_fingerprint=" + digest[:12])
            PY

            echo "Verifying monitoring/logging endpoints (local)"
            VPS_API_PORT="${VPS_API_PORT:-8001}"
            code_health=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 "http://127.0.0.1:${VPS_API_PORT}/healthz" || echo "000")
            code_metrics=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 "http://127.0.0.1:${VPS_API_PORT}/metrics" || echo "000")
            echo "healthz=${code_health} metrics=${code_metrics}"
            if [[ "${code_health}" != "200" ]]; then
              echo "ERROR: healthz not OK"
              exit 1
            fi
            if [[ "${code_metrics}" != "200" ]]; then
              echo "ERROR: metrics endpoint not reachable"
              exit 1
            fi

            echo "Verifying logs are being produced"
            log_lines=$(compose logs --since 2m api | wc -l | tr -d ' ')
            if [[ -z "${log_lines}" || "${log_lines}" == "0" ]]; then
              echo "ERROR: No recent API logs detected"
              exit 1
            fi

            echo "Deployed ${{ needs.build.outputs.sha_tag }}"

      - name: Wait for services to stabilize
        run: sleep 15

      - name: Smoke tests (from VPS)
        id: smoke
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        env:
          SITE_URL: ${{ env.SITE_URL }}
        with:
          host: ${{ steps.sshmeta.outputs.host }}
          username: ${{ steps.sshmeta.outputs.user }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: SITE_URL
          script: |
            set -euo pipefail

            if [[ -z "${SITE_URL:-}" ]]; then
              SITE_URL="https://amppattaya.com"
            fi

            FAIL=0

            check() {
              local label="$1"
              local url="$2"
              local expect_status="${3:-200}"

              local status
              # -L is REQUIRED: Next.js canonical redirect /en → /en/ returns
              # 308, not 200.  Without -L the smoke test would always FAIL on
              # every public page even when the site is healthy.
              status=$(curl -sS -L -o /dev/null -w "%{http_code}" --max-time 15 "$url" || echo "000")

              if [[ "$status" == "$expect_status" ]]; then
                echo "  OK   $label ($status)"
              else
                echo "  FAIL $label (got $status, expected $expect_status)"
                FAIL=1
              fi
            }

            echo "=== Smoke Tests — $SITE_URL ==="

            # Core public pages
            check "Homepage (EN)"       "$SITE_URL/en"
            check "Homepage (TH)"       "$SITE_URL/th"
            check "Buy page"            "$SITE_URL/en/buy"
            check "Rent page"           "$SITE_URL/en/rent"
            check "Invest page"         "$SITE_URL/en/invest"
            check "About page"          "$SITE_URL/en/about"
            check "Contact page"        "$SITE_URL/en/contact"
            check "Projects page"       "$SITE_URL/en/projects"

            # API health
            check "API health"          "$SITE_URL/api/healthz"
            check "API meta"            "$SITE_URL/api/v1/meta"


            # Static assets
            check "Favicon"             "$SITE_URL/favicon.ico"

            echo ""
            if [[ "$FAIL" -eq 0 ]]; then
              echo "=== All smoke tests passed ==="
              exit 0
            else
              echo "=== SMOKE TEST FAILURE ==="
              exit 1
            fi

      - name: Auto-rollback on failure
        if: steps.smoke.outcome == 'failure'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.sshmeta.outputs.host }}
          username: ${{ steps.sshmeta.outputs.user }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/flowbiz/clients/flowbiz-client-amp

            compose() {
              docker compose -f docker-compose.yml -f docker-compose.prod.yml "$@"
            }

            echo "Smoke test failed — rolling back..."

            DEPLOY_STATE_DIR="/opt/flowbiz/clients/flowbiz-client-amp/.deploy"
            PREVIOUS_IDS_FILE="$DEPLOY_STATE_DIR/previous_image_ids.env"

            if [[ ! -f "$PREVIOUS_IDS_FILE" ]]; then
              echo "ERROR: No previous image IDs found at $PREVIOUS_IDS_FILE"
              exit 1
            fi

            # shellcheck disable=SC1090
            source "$PREVIOUS_IDS_FILE"

            if [[ -z "${API_IMAGE_ID:-}" || -z "${ADMIN_IMAGE_ID:-}" ]]; then
              echo "ERROR: Missing previous image IDs (API_IMAGE_ID/ADMIN_IMAGE_ID)."
              echo "Cannot auto-rollback safely."
              exit 1
            fi

            echo "Previous API image ID:   $API_IMAGE_ID"
            echo "Previous Admin image ID: $ADMIN_IMAGE_ID"

            compose down --timeout 30 || true

            docker image tag "$API_IMAGE_ID" flowbiz-client-amp-api:latest
            docker image tag "$ADMIN_IMAGE_ID" flowbiz-client-amp-admin-app:latest

            compose up -d --remove-orphans

            echo "Rollback complete"

      - name: Fail pipeline if smoke tests failed
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "::error::Smoke tests failed. Automatic rollback executed."
          exit 1
