name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -e ".[dev]" pip-audit

      - name: Dependency vulnerability scan
        run: |
          pip-audit --strict --desc

      - name: Run ruff
        run: |
          ruff check .

      - name: Run mypy
        run: |
          mypy apps packages --ignore-missing-imports --no-strict-optional

      - name: Run pytest with coverage
        run: |
          pytest -q --tb=short --cov=apps --cov=packages --cov-report=term-missing --cov-fail-under=50

  admin-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: admin-app
        run: npm ci

      - name: npm audit
        working-directory: admin-app
        run: npm audit --audit-level=high

      - name: ESLint (a11y)
        working-directory: admin-app
        run: npx next lint

      - name: Vitest
        working-directory: admin-app
        run: npx vitest run

      - name: Next.js build
        working-directory: admin-app
        run: npm run build
