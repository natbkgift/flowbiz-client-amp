name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  governance-gates:
    name: Governance Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install ".[dev]"

      - name: Run autonomous governance gates
        env:
          GOV_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          GOV_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/governance/run_ci_gates.py --base "$GOV_BASE" --head "$GOV_HEAD" --out-dir .tmp/governance

  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Upgrade pip tooling
        run: |
          python -m pip install --upgrade pip setuptools

      - name: Install dependencies
        run: |
          pip install ".[dev]" pip-audit

      - name: Dependency vulnerability scan
        run: |
          pip-audit -s osv --strict --desc --skip-editable .

      - name: Run ruff
        run: |
          ruff check .

      - name: Run mypy
        continue-on-error: true
        run: |
          mypy apps packages --ignore-missing-imports --no-strict-optional

      - name: Run pytest with coverage
        run: |
          python -m coverage run --source=apps,packages -m pytest -q --tb=short
          python -m coverage report --show-missing --fail-under=50

  admin-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: admin-app
        run: npm ci

      - name: npm audit
        working-directory: admin-app
        run: npm audit --audit-level=high --omit=dev

      - name: ESLint (a11y)
        working-directory: admin-app
        run: npm run lint

      - name: Vitest
        working-directory: admin-app
        run: npx vitest run

      - name: Next.js build
        working-directory: admin-app
        # TURBOPACK=0 forces webpack (avoids intermittent Turbopack panic in
        # resource-constrained GitHub Actions runners — Next.js 16+ uses Turbopack
        # by default but can hit 'Dependency tracking disabled' panics on CI).
        env:
          TURBOPACK: '0'
        run: npm run build
