name: CI Governance Gates

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Governance Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi sqlalchemy pydantic pytest httpx python-multipart pillow python-dotenv

      - name: Run deterministic governance test suite
        run: |
          python -m pytest -q \
            tests/test_b1_media_library.py \
            tests/test_admin_properties_cms.py \
            tests/test_admin_domain_cms.py \
            tests/test_media_integrity.py \
            tests/test_b13_import_sync_mirror_pipeline.py

      - name: Media Integrity Strict Gate
        run: |
          python ops/scan_media_integrity.py \
            --strict \
            --write ops/logs/ci_media_integrity_report.json

      - name: Source Rights Registry B12 Gate
        run: |
          EXTRA_ARGS=""
          if [ "${B12_FAIL_ON_WARN:-false}" = "true" ]; then
            EXTRA_ARGS="--fail-on-warn"
          fi

          python ops/scan_source_rights_registry.py \
            --strict \
            ${EXTRA_ARGS} \
            --write ops/logs/ci_b12_source_rights_report.json

      - name: Project Cover Coverage B13 Gate
        run: |
          EXTRA_ARGS=""
          if [ "${B13_FAIL_ON_WARN:-false}" = "true" ]; then
            EXTRA_ARGS="--fail-on-warn"
          fi

          python scripts/report_project_cover_coverage.py \
            --strict \
            ${EXTRA_ARGS} \
            --write ops/logs/ci_b13_project_cover_report.json
