name: Auto-Merge (Autonomous)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Merge eligible PRs
        uses: actions/github-script@v7
        with:
          script: |
            const prs = context.payload.workflow_run.pull_requests || [];
            if (prs.length === 0) {
              core.info('No PR associated with this workflow_run.');
              return;
            }

            for (const prRef of prs) {
              const pull_number = prRef.number;
              const owner = context.repo.owner;
              const repo = context.repo.repo;

              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });

              // Autonomous governance only merges into main from the same repo (no forks).
              if (pr.base.ref !== 'main') {
                core.info(`#${pull_number}: base is ${pr.base.ref}, skipping`);
                continue;
              }
              if (pr.draft) {
                core.info(`#${pull_number}: draft, skipping`);
                continue;
              }
              if (!pr.head || !pr.head.repo || pr.head.repo.full_name !== `${owner}/${repo}`) {
                core.info(`#${pull_number}: fork or unknown head repo, skipping`);
                continue;
              }

              try {
                await github.rest.pulls.merge({
                  owner,
                  repo,
                  pull_number,
                  merge_method: 'squash',
                });
                core.info(`#${pull_number}: merged`);
              } catch (err) {
                core.warning(`#${pull_number}: merge failed: ${err.message}`);
              }
            }
