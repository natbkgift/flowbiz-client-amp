# nginx microcache example for amppattaya.com
#
# Goal: reduce TTFB for public pages (/en/*, /th/*) without caching admin/auth/api.
# TTL is intentionally short (microcache) to minimize staleness risk.
#
# Drop into an nginx server{} block (reverse proxy in front of Next.js).

# Cache zone
proxy_cache_path /var/cache/nginx/amppattaya levels=1:2 keys_zone=amppattaya:50m
                 inactive=10m max_size=1g use_temp_path=off;

# Cache key includes scheme + host + URI (query included)
proxy_cache_key "$scheme$proxy_host$request_uri";

map $request_method $is_cacheable_method {
  default 0;
  GET     1;
  HEAD    1;
}

# Do not cache admin/auth/api
map $request_uri $is_bypass_path {
  default 0;
  ~^/api/ 1;
  ~^/login/?$ 1;
  ~^/leads(/|$) 1;
  ~^/inquiries(/|$) 1;
  ~^/analytics(/|$) 1;
}

# Cache only locale public pages
map $request_uri $is_public_locale {
  default 0;
  ~^/(en|th)(/|$) 1;
}

# Combined eligibility
map "$is_cacheable_method:$is_bypass_path:$is_public_locale" $cache_eligible {
  default 0;
  ~^1:0:1$ 1;
}

