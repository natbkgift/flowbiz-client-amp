version: 1
id: blueprint_v1
title: AMP Master Execution Blueprint (Docs)

authority:
  source_of_truth:
    - docs/blueprint/README.md
    - docs/blueprint/00_strategy/00_MASTER_BLUEPRINT.md

execution_rules:
  no_skipping: true
  no_parallelization: true
  no_batch_execution: true

phases:
  - id: 0
    name: Strategic Foundation
    required_documents:
      - docs/blueprint/00_strategy/00_MASTER_BLUEPRINT.md
    depends_on: []
    pr_milestones: []
    success_criteria:
      - "Phase 0 lock recorded (segments, languages, KPIs)"
      - "Non-goals acknowledged"

  - id: 1
    name: Information Architecture
    required_documents:
      - docs/blueprint/01_architecture/01_MASTER_SITEMAP.md
      - docs/blueprint/01_architecture/02_URL_STRUCTURE_GUIDELINE.md
      - docs/blueprint/01_architecture/03_INDEX_MATRIX.md
      - docs/blueprint/01_architecture/04_XML_SITEMAP_STRATEGY.md
    depends_on: [0]
    pr_milestones:
      - PR-01
      - PR-02
    success_criteria:
      - "Sitemap + URL structure finalized and consistent"
      - "Index matrix + XML sitemap strategy consistent"

  - id: 2
    name: Data Architecture
    required_documents:
      - docs/blueprint/02_data/05_DATABASE_SCHEMA.md
      - docs/blueprint/02_data/06_PROPERTY_TYPE_STANDARD.md
      - docs/blueprint/02_data/07_PRODUCT_TEMPLATE_SPEC.md
    depends_on: [1]
    pr_milestones:
      - PR-03
      - PR-04
    success_criteria:
      - "DB schema + property type standard aligned"
      - "Product templates spec aligns with schema"

  - id: 3
    name: SEO & Linking Layer
    required_documents:
      - docs/blueprint/03_seo/08_CONTENT_PILLAR_MAP.md
      - docs/blueprint/03_seo/09_INTERNAL_LINKING_BLUEPRINT.md
      - docs/blueprint/03_seo/10_SCHEMA_MARKUP_PLAN.md
      - docs/blueprint/03_seo/11_CRAWL_OPTIMIZATION_PLAN.md
    depends_on: [1, 2]
    pr_milestones:
      - PR-05
      - PR-06
    success_criteria:
      - "Internal linking blueprint ready for implementation"
      - "Schema markup plan complete"
      - "Crawl/noindex rules documented"

  - id: 4
    name: Conversion & Funnel Layer
    required_documents:
      - docs/blueprint/04_conversion/12_FUNNEL_DESIGN.md
      - docs/blueprint/04_conversion/13_CTA_STANDARD.md
    depends_on: [2, 3]
    pr_milestones:
      - PR-07
    success_criteria:
      - "Funnel design + CTA standard implemented and measurable"

  - id: 5
    name: Data Population Plan
    required_documents:
      - docs/blueprint/05_data_population/14_DATA_IMPORT_SEQUENCE.md
      - docs/blueprint/05_data_population/15_CONTENT_STANDARD.md
    depends_on: [2, 4]
    pr_milestones:
      - PR-08
    success_criteria:
      - "Import sequence is consistent with schema and templates"
      - "Content standard ready for population"

  - id: 6
    name: QA & Release Control
    required_documents:
      - docs/blueprint/06_release/16_QA_CHECKLIST.md
      - docs/blueprint/06_release/17_RELEASE_PROTOCOL.md
    depends_on: [0, 1, 2, 3, 4, 5]
    pr_milestones:
      - PR-09
      - PR-10
    success_criteria:
      - "QA checklist passes for applicable scope"
      - "Release protocol followed (branch/PR + deterministic gates)"
