version: 1.0
owner: amp-platform-governance
scope:
  - web
  - finder
  - listing
  - booking
  - crm
  - seo
  - ai

evaluation_window:
  staging_required: true
  production_monitor_hours: 24
  baseline_window_days: 14

# -------------------------------------------------
# PRIMARY BUSINESS METRICS
# -------------------------------------------------

conversion:
  primary:
    name: lead_submission_rate
    description: leads / unique visitors
    acceptable_delta: -5%
    rollback_trigger: -15%

  secondary:
    - name: advisor_contact_click_rate
      acceptable_delta: -7%
      rollback_trigger: -20%

    - name: booking_intent_rate
      acceptable_delta: -6%
      rollback_trigger: -15%

    - name: finder_completion_rate
      acceptable_delta: -8%
      rollback_trigger: -18%

    - name: project_detail_engagement_rate
      acceptable_delta: -5%
      rollback_trigger: -15%

# -------------------------------------------------
# CRM HEALTH METRICS
# -------------------------------------------------

crm:
  webhook_success_rate:
    target: 99.9%
    rollback_trigger: < 98%

  duplicate_lead_rate:
    target: < 1%
    rollback_trigger: > 3%

  lead_creation_latency_ms:
    target: 800
    rollback_trigger: 2000

  crm_sync_integrity:
    requirement: idempotent
    rollback_trigger: mismatch_detected

# -------------------------------------------------
# SEO HEALTH METRICS
# -------------------------------------------------

seo:
  organic_sessions:
    acceptable_delta: -5%
    rollback_trigger: -15%

  index_coverage:
    requirement: stable
    rollback_trigger: significant_drop

  structured_data_validity:
    target: 100%
    rollback_trigger: < 98%

  canonical_integrity:
    requirement: consistent
    rollback_trigger: mismatch

  sitemap_integrity:
    requirement: intact
    rollback_trigger: missing_or_corrupted

# -------------------------------------------------
# PERFORMANCE SLO
# -------------------------------------------------

performance:
  lcp_ms:
    target: 2500
    acceptable_delta: +200
    rollback_trigger: > 3200

  cls:
    target: baseline_or_lower
    rollback_trigger: +0.05_over_baseline

  ttfb_ms:
    target: 800
    rollback_trigger: > 1500

  api_latency_ms:
    finder:
      target: 600
      rollback_trigger: 1200

    booking:
      target: 700
      rollback_trigger: 1400

    crm:
      target: 800
      rollback_trigger: 1600

# -------------------------------------------------
# DETERMINISM METRICS
# -------------------------------------------------

determinism:
  ranking_consistency:
    requirement: identical_output_3_runs
    rollback_trigger: mismatch_detected

  cache_key_integrity:
    requirement: all_runtime_dimensions_reflected
    rollback_trigger: missing_dimension

  seed_consistency:
    requirement: fixed_seed_hash
    rollback_trigger: deviation_detected

# -------------------------------------------------
# EXPERIENCE STABILITY METRICS
# -------------------------------------------------

experience:
  cta_click_distribution:
    requirement: stable_ratio_primary_secondary
    rollback_trigger: abnormal_shift

  trust_visibility_rate:
    requirement: present_above_fold
    rollback_trigger: absence_detected

  advisor_entry_visibility:
    requirement: visible_within_two_scrolls
    rollback_trigger: missing

  layout_stability:
    requirement: no_major_shift
    rollback_trigger: visual_regression

# -------------------------------------------------
# ERROR & RELIABILITY
# -------------------------------------------------

reliability:
  http_500_rate:
    threshold: baseline +30%
    rollback_trigger: exceeded

  api_error_rate:
    threshold: baseline +25%
    rollback_trigger: exceeded

  infra_failure_events:
    requirement: none
    rollback_trigger: detected

# -------------------------------------------------
# AI / RECOMMENDATION SAFETY
# -------------------------------------------------

ai:
  inference_latency_ms:
    target: 900
    rollback_trigger: > 1800

  recommendation_consistency:
    requirement: deterministic_within_boundary
    rollback_trigger: drift_detected

  behavioral_signal_integrity:
    requirement: stable_input_stream
    rollback_trigger: corruption_detected

# -------------------------------------------------
# GLOBAL ROLLBACK POLICY
# -------------------------------------------------

rollback_policy:
  trigger_mode: automatic
  if_any:
    - primary_conversion_breach
    - crm_failure
    - seo_integrity_break
    - performance_slo_violation
    - determinism_failure
    - experience_regression
    - reliability_spike

  actions:
    - revert_sha
    - redeploy_container
    - purge_cdn
    - validate_logs
    - rerun_smoke_tests
